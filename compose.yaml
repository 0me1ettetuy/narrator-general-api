name: narrator-general-api-${NODE_ENV:-development}

services:
  db:
    image: postgres:16-alpine
    container_name: narrator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:? Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:? Set POSTGRES_DB}
    ports:
      - '${POSTGRES_PUBLISHED_PORT:-5432}:5432'
    volumes:
      - narrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: narrator-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PUBLISHED_PORT:-6379}:6379'
    volumes:
      - narrator_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: ./docker/minio
    image: narrator-minio:local
    pull_policy: build
    container_name: narrator-minio
    profiles: ['${MINIO_ENABLED:-false}']
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - '${MINIO_API_PUBLISHED_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PUBLISHED_PORT:-9001}:9001'
    volumes:
      - narrator_minio_data:/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --output-document=/dev/null http://localhost:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: amazon/aws-cli:2.31.23
    container_name: narrator-minio-init
    profiles: ['${MINIO_ENABLED:-false}']
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$MINIO_ROOT_USER"
        export AWS_SECRET_ACCESS_KEY="$$MINIO_ROOT_PASSWORD"
        export AWS_DEFAULT_REGION=us-east-1
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null; do
          sleep 1
        done
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$STORAGE_BUCKET" 2>/dev/null || \
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$STORAGE_BUCKET"

  migrate:
    build:
      context: .
    image: narrator-api:local
    pull_policy: build
    container_name: narrator-migrate
    env_file: .env
    restart: 'no'
    command:
      [
        '/bin/sh',
        '-ec',
        './node_modules/.bin/prisma db update --no-interactive --confirm "$$POSTGRES_DB"',
      ]
    environment: &application-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:? Set POSTGRES_USER}:${POSTGRES_PASSWORD:? Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:? Set POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORAGE_INTERNAL_ENDPOINT: ${STORAGE_INTERNAL_ENDPOINT:-}
      TTS_LOCAL_PIPER_EN_US_AMY_HEALTH_URL: http://piper-tts:5000/v1/audio/models
      TTS_LOCAL_PIPER_EN_US_AMY_URL: http://piper-tts:5000
      TTS_LOCAL_KOKORO_82M_HEALTH_URL: http://kokoro-tts:7860/health/ready
      TTS_LOCAL_KOKORO_82M_URL: http://kokoro-tts:7860
      TTS_LOCAL_QWEN3_TTS_0_6B_HEALTH_URL: http://qwen3-tts:8001/health
      TTS_LOCAL_QWEN3_TTS_0_6B_URL: http://qwen3-tts:8001
      TTS_LOCAL_CHATTERBOX_TURBO_HEALTH_URL: http://chatterbox-tts:8000/healthz
      TTS_LOCAL_CHATTERBOX_TURBO_URL: http://chatterbox-tts:8000
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
    image: narrator-api:local
    pull_policy: build
    container_name: narrator-api
    env_file: .env
    restart: unless-stopped
    command: ['node', 'dist/main']
    environment:
      <<: *application-environment
      PORT: '3000'
    ports:
      - '${API_PUBLISHED_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/openapi-json\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: narrator-api:local
    pull_policy: never
    container_name: narrator-worker
    env_file: .env
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  piper-tts:
    image: ${TTS_LOCAL_PIPER_IMAGE:-kamilkrawiec/piper-openai-tts:latest}
    container_name: narrator-piper-tts
    profiles: ['${TTS_LOCAL_PIPER_EN_US_AMY_ENABLED:-false}']
    restart: unless-stopped
    environment:
      PORT: '5000'
      DATA_DIR: /data
    ports:
      - '127.0.0.1:${TTS_LOCAL_PIPER_PUBLISHED_PORT:-9500}:5000'
    volumes:
      - narrator_piper_tts_data:/data

  kokoro-tts:
    image: ${TTS_LOCAL_KOKORO_IMAGE:-hangrylabs/kokorotts:latest}
    container_name: narrator-kokoro-tts
    profiles: ['${TTS_LOCAL_KOKORO_82M_ENABLED:-false}']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${TTS_LOCAL_KOKORO_PUBLISHED_PORT:-7860}:7860'
    volumes:
      - narrator_kokoro_tts_data:/app/persistent

  qwen3-tts:
    image: ${TTS_LOCAL_QWEN3_TTS_0_6B_IMAGE:-ghcr.io/malaiwah/qwen3-tts-server:latest}
    container_name: narrator-qwen3-tts
    profiles: ['${TTS_LOCAL_QWEN3_TTS_0_6B_ENABLED:-false}']
    restart: unless-stopped
    environment:
      QWEN3_TTS_MODEL_ID: Qwen/Qwen3-TTS-12Hz-0.6B-Base
      QWEN3_TTS_VOICES_DIR: /data/voices
      HF_HOME: /root/.cache/huggingface
    ports:
      - '127.0.0.1:${TTS_LOCAL_QWEN3_TTS_0_6B_PUBLISHED_PORT:-8001}:8001'
    volumes:
      - narrator_qwen3_tts_data:/data
      - narrator_qwen3_tts_huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  chatterbox-tts:
    image: ${TTS_LOCAL_CHATTERBOX_TURBO_IMAGE:-ghcr.io/openttsgroup/chatterbox-open-tts:latest}
    container_name: narrator-chatterbox-tts
    profiles: ['${TTS_LOCAL_CHATTERBOX_TURBO_ENABLED:-false}']
    restart: unless-stopped
    environment:
      CHATTERBOX_VARIANT: turbo
      CHATTERBOX_DEVICE: cuda
      CHATTERBOX_DEFAULT_LANGUAGE: en
      MAX_CONCURRENCY: '1'
      VOICES_DIR: /voices
    ports:
      - '127.0.0.1:${TTS_LOCAL_CHATTERBOX_TURBO_PUBLISHED_PORT:-8000}:8000'
    volumes:
      - narrator_chatterbox_tts_cache:/root/.cache
      - narrator_chatterbox_tts_voices:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  narrator_postgres_data:
  narrator_redis_data:
  narrator_minio_data:
  narrator_piper_tts_data:
  narrator_kokoro_tts_data:
  narrator_qwen3_tts_data:
  narrator_qwen3_tts_huggingface_cache:
  narrator_chatterbox_tts_cache:
  narrator_chatterbox_tts_voices:

networks:
  default:
    name: narrator-network
