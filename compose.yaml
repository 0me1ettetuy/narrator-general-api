name: narrator-general-api-${NODE_ENV:-development}

services:
  db:
    image: postgres:16-alpine
    container_name: narrator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:? Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:? Set POSTGRES_DB}
    ports:
      - '${POSTGRES_PUBLISHED_PORT:-5432}:5432'
    volumes:
      - narrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: narrator-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PUBLISHED_PORT:-6379}:6379'
    volumes:
      - narrator_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: ./docker/minio
    image: narrator-minio:local
    pull_policy: build
    container_name: narrator-minio
    profiles: ['${MINIO_ENABLED:-false}']
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - '${MINIO_API_PUBLISHED_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PUBLISHED_PORT:-9001}:9001'
    volumes:
      - narrator_minio_data:/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --output-document=/dev/null http://localhost:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: amazon/aws-cli:2.31.23
    container_name: narrator-minio-init
    profiles: ['${MINIO_ENABLED:-false}']
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$MINIO_ROOT_USER"
        export AWS_SECRET_ACCESS_KEY="$$MINIO_ROOT_PASSWORD"
        export AWS_DEFAULT_REGION=us-east-1
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null; do
          sleep 1
        done
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$STORAGE_BUCKET" 2>/dev/null || \
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$STORAGE_BUCKET"

  migrate:
    build:
      context: .
    image: narrator-api:local
    pull_policy: build
    container_name: narrator-migrate
    env_file: .env
    restart: 'no'
    command:
      [
        '/bin/sh',
        '-ec',
        './node_modules/.bin/prisma db update --no-interactive --confirm "$$POSTGRES_DB"',
      ]
    environment: &application-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:? Set POSTGRES_USER}:${POSTGRES_PASSWORD:? Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:? Set POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORAGE_INTERNAL_ENDPOINT: ${STORAGE_INTERNAL_ENDPOINT:-}
      TTS_LOCAL_SILERO_TTS_HEALTH_URL: http://silero-tts:8001/health
      TTS_LOCAL_SILERO_TTS_URL: http://silero-tts:8001
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
    image: narrator-api:local
    pull_policy: build
    container_name: narrator-api
    env_file: .env
    restart: unless-stopped
    command: ['node', 'dist/main']
    environment:
      <<: *application-environment
      PORT: '3000'
    ports:
      - '${API_PUBLISHED_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/openapi-json\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: narrator-api:local
    pull_policy: never
    container_name: narrator-worker
    env_file: .env
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  silero-tts:
    # CPU only (no GPU needed); models are baked into the image.
    build:
      context: docker/silero-tts
    image: narrator-silero-tts:local
    container_name: narrator-silero-tts
    profiles: ['${TTS_LOCAL_SILERO_TTS_ENABLED:-false}']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${TTS_LOCAL_SILERO_TTS_PUBLISHED_PORT:-8001}:8001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8001/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  narrator_postgres_data:
  narrator_redis_data:
  narrator_minio_data:

networks:
  default:
    name: narrator-network
